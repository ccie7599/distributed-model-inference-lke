apiVersion: apps/v1
kind: Deployment
metadata:
  name: mortgage-inference
  namespace: demo-mortgage-inference
  labels:
    app: mortgage-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mortgage-inference
  template:
    metadata:
      labels:
        app: mortgage-inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        # Vault Agent Injector — write the auth token to /vault/secrets/token
        # on every container in the pod that opts in via shared volume.
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: "api"
        vault.hashicorp.com/agent-inject-secret-token: "api/data/mortgage-inference/config"
        vault.hashicorp.com/agent-inject-template-token: |
          {{- with secret "api/data/mortgage-inference/config" -}}
          {{ .Data.data.AUTH_TOKEN }}
          {{- end }}
        # Render into the tls-proxy container so the init render step can read it.
        vault.hashicorp.com/agent-inject-containers: "tls-proxy-render"
    spec:
      serviceAccountName: app-vault-access
      imagePullSecrets:
        - name: harbor-creds
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"

      initContainers:
        # Render the nginx config from the ConfigMap template, substituting the
        # token that Vault Agent wrote to /vault/secrets/token. The rendered
        # file lands in an emptyDir that the nginx sidecar mounts as its conf.d.
        - name: tls-proxy-render
          image: nginx:alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              TOKEN=$(cat /vault/secrets/token)
              sed "s|__AUTH_TOKEN__|${TOKEN}|g" /config-template/default.conf.tmpl \
                > /config-rendered/default.conf
              echo "Rendered nginx config (token length: ${#TOKEN})"
          volumeMounts:
            - name: config-template
              mountPath: /config-template
              readOnly: true
            - name: config-rendered
              mountPath: /config-rendered

      containers:
        - name: mortgage-inference
          image: harbor.harbor.svc.cluster.local/presales/mortgage-inference:ce7d2d0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MODEL_PATH
              value: "/models/bert-base-uncased/model.onnx"
            - name: ONNX_EXECUTION_PROVIDER
              value: "CUDAExecutionProvider"
            - name: MAX_SEQUENCE_LENGTH
              value: "512"
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(NODE_IP):4318"
            - name: OTEL_SERVICE_NAME
              value: "mortgage-inference"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=presales,service.namespace=demo-mortgage-inference"
          resources:
            requests:
              memory: "8Gi"
              cpu: "2"
              nvidia.com/gpu: "1"
            limits:
              memory: "12Gi"
              cpu: "4"
              nvidia.com/gpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 5
            failureThreshold: 5

        - name: tls-proxy
          image: nginx:alpine
          ports:
            - name: https
              containerPort: 443
              protocol: TCP
          volumeMounts:
            - name: tls-certs
              mountPath: /etc/nginx/ssl
              readOnly: true
            - name: config-rendered
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: demo-html
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

      volumes:
        - name: tls-certs
          secret:
            secretName: mortgage-inference-tls
        - name: config-template
          configMap:
            name: tls-proxy-conf-template
        - name: config-rendered
          emptyDir: {}
        - name: demo-html
          configMap:
            name: demo-html

      terminationGracePeriodSeconds: 30
