apiVersion: v1
kind: ConfigMap
metadata:
  name: tls-proxy-conf-template
  namespace: demo-mortgage-inference
data:
  default.conf.tmpl: |
    log_format akamai '$http_true_client_ip - $remote_addr [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" token=$arg_token cookie=$cookie_auth_token';

    map $arg_token $set_auth_cookie {
        "__AUTH_TOKEN__" "auth_token=__AUTH_TOKEN__; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age=86400";
        default "";
    }

    server {
        listen 443 ssl;
        server_name mortgage-inference.connected-cloud.io;

        ssl_certificate /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        access_log /var/log/nginx/access.log akamai;

        # Token auth: query string or cookie
        set $deny 1;
        if ($arg_token = "__AUTH_TOKEN__") { set $deny 0; }
        if ($cookie_auth_token = "__AUTH_TOKEN__") { set $deny 0; }
        if ($uri = /health) { set $deny 0; }
        if ($uri = /metrics) { set $deny 0; }
        if ($deny) { return 401; }

        add_header Set-Cookie $set_auth_cookie;

        # Demo UI — static HTML served from nginx
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ @inference;
        }

        location @inference {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location /v1/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location = /health {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
        }

        location = /metrics {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
        }
    }
