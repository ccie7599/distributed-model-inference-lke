"data":
  "index.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Mortgage Product Intelligence</title>\n    <script src=\"https://cdn.jsdelivr.net/npm/chart.js\"></script>\n    <link rel=\"stylesheet\" href=\"https://unpkg.com/leaflet@1.9.4/dist/leaflet.css\" />\n    <script src=\"https://unpkg.com/leaflet@1.9.4/dist/leaflet.js\"></script>\n    <style>\n        :root {\n            --bg-primary: #0d1117;\n            --bg-secondary: #161b22;\n            --bg-tertiary: #21262d;\n            --border-color: #30363d;\n            --text-primary: #e6edf3;\n            --text-secondary: #8b949e;\n            --accent-red: #e63946;\n            --accent-coral: #ff6b6b;\n            --accent-green: #3fb950;\n            --accent-blue: #58a6ff;\n            --accent-purple: #a371f7;\n            --accent-orange: #d29922;\n            --gradient-start: #e63946;\n            --gradient-end: #ff6b6b;\n        }\n\n        * { margin: 0; padding: 0; box-sizing: border-box; }\n\n        body {\n            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;\n            background: var(--bg-primary);\n            color: var(--text-primary);\n            min-height: 100vh;\n            line-height: 1.5;\n        }\n\n        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }\n\n        header {\n            text-align: center;\n            margin-bottom: 2rem;\n            padding-bottom: 1.5rem;\n            border-bottom: 1px solid var(--border-color);\n        }\n\n        h1 {\n            font-size: 2.5rem;\n            font-weight: 600;\n            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));\n            -webkit-background-clip: text;\n            -webkit-text-fill-color: transparent;\n            background-clip: text;\n            margin-bottom: 0.5rem;\n        }\n\n        .subtitle { color: var(--text-secondary); font-size: 1.1rem; }\n        .subtitle a { color: var(--accent-blue); text-decoration: none; }\n\n        /* Config panel */\n        .config-panel {\n            background: var(--bg-secondary);\n            border: 1px solid var(--border-color);\n            border-radius: 12px;\n            padding: 1.5rem;\n            margin-bottom: 1.5rem;\n        }\n\n        .config-row {\n            display: flex;\n            gap: 1rem;\n            align-items: flex-end;\n            flex-wrap: wrap;\n        }\n\n        .input-group { flex: 1; min-width: 250px; }\n\n        label {\n            display: block;\n            color: var(--text-secondary);\n            font-size: 0.875rem;\n            margin-bottom: 0.5rem;\n            font-weight: 500;\n        }\n\n        input[type=\"text\"], input[type=\"number\"], textarea {\n            width: 100%;\n            padding: 0.75rem 1rem;\n            background: var(--bg-tertiary);\n            border: 1px solid var(--border-color);\n            border-radius: 8px;\n            color: var(--text-primary);\n            font-size: 1rem;\n            font-family: inherit;\n            transition: border-color 0.2s, box-shadow 0.2s;\n            resize: vertical;\n        }\n\n        input:focus, textarea:focus {\n            outline: none;\n            border-color: var(--accent-red);\n            box-shadow: 0 0 0 3px rgba(230, 57, 70, 0.15);\n        }\n\n        .btn {\n            padding: 0.75rem 1.5rem;\n            border: none;\n            border-radius: 8px;\n            font-size: 1rem;\n            font-weight: 600;\n            cursor: pointer;\n            transition: all 0.2s;\n            display: inline-flex;\n            align-items: center;\n            gap: 0.5rem;\n        }\n\n        .btn-primary {\n            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));\n            color: white;\n        }\n\n        .btn-primary:hover {\n            transform: translateY(-1px);\n            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);\n        }\n\n        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }\n\n        .btn-secondary {\n            background: var(--bg-tertiary);\n            color: var(--text-primary);\n            border: 1px solid var(--border-color);\n        }\n\n        .btn-secondary:hover { background: var(--border-color); }\n\n        .connection-status {\n            display: flex;\n            align-items: center;\n            gap: 0.5rem;\n            padding: 0.5rem 1rem;\n            border-radius: 20px;\n            font-size: 0.875rem;\n            font-weight: 500;\n        }\n\n        .connection-status.connected { background: rgba(63, 185, 80, 0.15); color: var(--accent-green); }\n        .connection-status.disconnected { background: rgba(248, 81, 73, 0.15); color: var(--accent-coral); }\n        .connection-status.testing { background: rgba(210, 153, 34, 0.15); color: var(--accent-orange); }\n\n        .status-dot {\n            width: 8px; height: 8px; border-radius: 50%;\n            background: currentColor; display: inline-block;\n        }\n\n        /* Tabs */\n        .tabs {\n            display: flex;\n            gap: 0;\n            margin-bottom: 1.5rem;\n            border-bottom: 2px solid var(--border-color);\n        }\n\n        .tab {\n            padding: 1rem 2rem;\n            cursor: pointer;\n            color: var(--text-secondary);\n            font-weight: 600;\n            font-size: 1rem;\n            border-bottom: 2px solid transparent;\n            margin-bottom: -2px;\n            transition: all 0.2s;\n        }\n\n        .tab:hover { color: var(--text-primary); }\n\n        .tab.active {\n            color: var(--accent-red);\n            border-bottom-color: var(--accent-red);\n        }\n\n        .tab-content { display: none; }\n        .tab-content.active { display: block; }\n\n        /* Input area */\n        .input-area {\n            background: var(--bg-secondary);\n            border: 1px solid var(--border-color);\n            border-radius: 12px;\n            padding: 1.5rem;\n            margin-bottom: 1.5rem;\n        }\n\n        .input-area textarea { min-height: 80px; }\n\n        .sample-chips {\n            display: flex;\n            flex-wrap: wrap;\n            gap: 0.5rem;\n            margin-top: 1rem;\n        }\n\n        .chip {\n            padding: 0.5rem 0.75rem;\n            background: var(--bg-tertiary);\n            border: 1px solid var(--border-color);\n            border-radius: 6px;\n            font-size: 0.8rem;\n            color: var(--text-secondary);\n            cursor: pointer;\n            transition: all 0.2s;\n        }\n\n        .chip:hover { border-color: var(--accent-red); color: var(--text-primary); }\n\n        .action-row {\n            display: flex;\n            gap: 1rem;\n            align-items: center;\n            margin-top: 1rem;\n        }\n\n        .latency-display {\n            margin-left: auto;\n            font-size: 0.9rem;\n            color: var(--text-secondary);\n        }\n\n        .latency-display strong {\n            color: var(--accent-coral);\n            font-size: 1.1rem;\n        }\n\n        /* Results: product cards */\n        .results-grid {\n            display: grid;\n            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));\n            gap: 1rem;\n            margin-bottom: 1.5rem;\n        }\n\n        .product-card {\n            background: var(--bg-secondary);\n            border: 1px solid var(--border-color);\n            border-radius: 12px;\n            padding: 1.25rem;\n            transition: border-color 0.2s;\n        }\n\n        .product-card.top-pick {\n            border-color: var(--accent-red);\n            box-shadow: 0 0 0 1px var(--accent-red);\n        }\n\n        .product-card-header {\n            display: flex;\n            justify-content: space-between;\n            align-items: flex-start;\n            margin-bottom: 0.75rem;\n        }\n\n        .product-name {\n            font-weight: 700;\n            font-size: 1.1rem;\n        }\n\n        .product-badge {\n            padding: 0.2rem 0.6rem;\n            border-radius: 4px;\n            font-size: 0.7rem;\n            font-weight: 700;\n            text-transform: uppercase;\n        }\n\n        .product-badge.top { background: var(--accent-red); color: white; }\n        .product-badge.alt { background: var(--bg-tertiary); color: var(--text-secondary); }\n\n        .confidence-bar {\n            height: 6px;\n            background: var(--bg-tertiary);\n            border-radius: 3px;\n            margin: 0.75rem 0;\n            overflow: hidden;\n        }\n\n        .confidence-fill {\n            height: 100%;\n            border-radius: 3px;\n            transition: width 0.5s ease;\n        }\n\n        .confidence-text {\n            font-size: 0.85rem;\n            color: var(--text-secondary);\n            margin-bottom: 0.75rem;\n        }\n\n        .confidence-text strong {\n            color: var(--text-primary);\n            font-size: 1rem;\n        }\n\n        .product-details {\n            font-size: 0.8rem;\n            color: var(--text-secondary);\n        }\n\n        .product-details .detail-row {\n            display: flex;\n            justify-content: space-between;\n            padding: 0.3rem 0;\n            border-bottom: 1px solid var(--border-color);\n        }\n\n        .product-details .detail-row:last-child { border-bottom: none; }\n\n        .highlights {\n            display: flex;\n            flex-wrap: wrap;\n            gap: 0.4rem;\n            margin-top: 0.75rem;\n        }\n\n        .highlight-tag {\n            padding: 0.2rem 0.5rem;\n            background: rgba(230, 57, 70, 0.1);\n            color: var(--accent-coral);\n            border-radius:\
    \ 4px;\n            font-size: 0.7rem;\n            font-weight: 500;\n        }\n\n        /* Borrower match cards */\n        .match-card {\n            background: var(--bg-secondary);\n            border: 1px solid var(--border-color);\n            border-radius: 12px;\n            padding: 1.25rem;\n            margin-bottom: 1rem;\n        }\n\n        .match-card-header {\n            display: flex;\n            justify-content: space-between;\n            align-items: center;\n            margin-bottom: 0.5rem;\n        }\n\n        .match-name { font-weight: 700; font-size: 1.05rem; }\n\n        .similarity-badge {\n            padding: 0.3rem 0.75rem;\n            border-radius: 20px;\n            font-size: 0.85rem;\n            font-weight: 700;\n        }\n\n        .similarity-high { background: rgba(63, 185, 80, 0.15); color: var(--accent-green); }\n        .similarity-medium { background: rgba(210, 153, 34, 0.15); color: var(--accent-orange); }\n        .similarity-low { background: rgba(139, 148, 158, 0.15); color: var(--text-secondary); }\n\n        .match-meta {\n            display: flex;\n            flex-wrap: wrap;\n            gap: 1rem;\n            font-size: 0.85rem;\n            color: var(--text-secondary);\n            margin: 0.5rem 0;\n        }\n\n        .match-meta span { display: flex; align-items: center; gap: 0.3rem; }\n\n        .match-description {\n            font-size: 0.85rem;\n            color: var(--text-secondary);\n            line-height: 1.6;\n            margin: 0.75rem 0;\n            padding: 0.75rem;\n            background: var(--bg-tertiary);\n            border-radius: 8px;\n        }\n\n        .match-outcome {\n            font-size: 0.85rem;\n            font-weight: 600;\n            color: var(--accent-green);\n        }\n\n        /* Stats bar */\n        .stats-grid {\n            display: grid;\n            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));\n            gap: 1rem;\n            margin-bottom: 1.5rem;\n        }\n\n        .stat-card {\n            background: var(--bg-secondary);\n            border: 1px solid var(--border-color);\n            border-radius: 12px;\n            padding: 1rem;\n            text-align: center;\n        }\n\n        .stat-value {\n            font-size: 1.75rem;\n            font-weight: 700;\n            margin-bottom: 0.25rem;\n        }\n\n        .stat-label {\n            color: var(--text-secondary);\n            font-size: 0.8rem;\n            text-transform: uppercase;\n            letter-spacing: 0.05em;\n        }\n\n        .stat-value.classify { color: var(--accent-red); }\n        .stat-value.match { color: var(--accent-purple); }\n        .stat-value.success { color: var(--accent-green); }\n        .stat-value.latency { color: var(--accent-coral); }\n\n        /* Performance panel */\n        .perf-panel {\n            background: var(--bg-secondary);\n            border: 1px solid var(--border-color);\n            border-radius: 12px;\n            overflow: hidden;\n            margin-top: 1.5rem;\n        }\n\n        .perf-header {\n            padding: 1rem 1.25rem;\n            border-bottom: 1px solid var(--border-color);\n            display: flex;\n            justify-content: space-between;\n            align-items: center;\n            cursor: pointer;\n        }\n\n        .perf-header:hover { background: var(--bg-tertiary); }\n\n        .perf-body { padding: 1.25rem; }\n\n        .chart-container { position: relative; height: 250px; }\n\n        .placeholder {\n            text-align: center;\n            padding: 3rem 2rem;\n            color: var(--text-secondary);\n        }\n\n        .placeholder h3 { margin-bottom: 0.5rem; color: var(--text-primary); }\n\n        /* Edge Map */\n        #map {\n            height: 500px;\n            width: 100%;\n            border-radius: 12px;\n            border: 1px solid var(--border-color);\n        }\n\n        .map-container {\n            background: var(--bg-secondary);\n            border-radius: 12px;\n            padding: 1.5rem;\n            border: 1px solid var(--border-color);\n        }\n\n        .map-header {\n            display: flex;\n            justify-content: space-between;\n            align-items: center;\n            margin-bottom: 1rem;\n        }\n\n        .map-header h3 { font-size: 1.1rem; font-weight: 600; }\n\n        .detect-btn {\n            padding: 0.5rem 1rem;\n            background: linear-gradient(135deg, #58a6ff, #a371f7);\n            color: white;\n            border: none;\n            border-radius: 8px;\n            font-weight: 600;\n            font-size: 0.85rem;\n            cursor: pointer;\n            transition: all 0.2s;\n        }\n\n        .detect-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(88, 166, 255, 0.3); }\n        .detect-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }\n\n        .map-legend {\n            display: flex;\n            gap: 1.5rem;\n            margin-top: 1rem;\n            justify-content: center;\n            flex-wrap: wrap;\n        }\n\n        .map-legend-item {\n            display: flex;\n            align-items: center;\n            gap: 0.5rem;\n            font-size: 0.875rem;\n            color: var(--text-secondary);\n        }\n\n        .map-legend-dot {\n            width: 12px;\n            height: 12px;\n            border-radius: 50%;\n        }\n\n        .map-legend-dot.user { background: #4FC3F7; }\n        .map-legend-dot.edge { background: #FF9800; }\n        .map-legend-dot.compute { background: #FF5252; }\n\n        .map-info {\n            display: grid;\n            grid-template-columns: repeat(3, 1fr);\n            gap: 1rem;\n            margin-top: 1.5rem;\n        }\n\n        .location-card {\n            background: var(--bg-tertiary);\n            border-radius: 8px;\n            padding: 1rem;\n            border-left: 4px solid var(--accent-blue);\n        }\n\n        .location-card.edge-card { border-left-color: #FF9800; }\n        .location-card.compute-card { border-left-color: #FF5252; }\n\n        .location-label {\n            font-size: 0.7rem;\n            text-transform: uppercase;\n            letter-spacing: 0.05em;\n            color: var(--text-secondary);\n            margin-bottom: 0.25rem;\n        }\n\n        .location-name {\n            font-size: 1.1rem;\n            font-weight: 600;\n            margin-bottom: 0.25rem;\n        }\n\n        .location-name.user-loc { color: #4FC3F7; }\n        .location-name.edge-loc { color: #FF9800; }\n        .location-name.compute-loc { color: #FF5252; }\n\n        .location-detail {\n            font-size: 0.8rem;\n            color: var(--text-secondary);\n        }\n\n        .latency-breakdown {\n            background: var(--bg-secondary);\n            border: 1px solid var(--border-color);\n            border-radius: 12px;\n            padding: 1.5rem;\n            margin-top: 1.5rem;\n            text-align: center;\n        }\n\n        .latency-breakdown h3 {\n            font-size: 1.1rem;\n            font-weight: 600;\n            margin-bottom: 0.5rem;\n        }\n\n        .latency-breakdown .hint {\n            color: var(--text-secondary);\n            font-size: 0.85rem;\n            margin-bottom: 1rem;\n        }\n\n        .breakdown-grid {\n            display: grid;\n            grid-template-columns: repeat(4, 1fr);\n            gap: 1rem;\n        }\n\n        .breakdown-item { text-align: center; }\n\n        .breakdown-value {\n            font-size: 1.75rem;\n            font-weight: 700;\n        }\n\n        .breakdown-label {\n            font-size: 0.8rem;\n            color: var(--text-secondary);\n            margin-top: 0.25rem;\n        }\n\n        /* Leaflet custom markers */\n        .custom-marker { background: none !important; border: none !important; }\n\n        .marker-dot {\n            width: 16px;\n            height: 16px;\n            border-radius: 50%;\n            position: relative;\n        }\n\n        .marker-dot.user { background: #4FC3F7; box-shadow: 0 0 12px rgba(79, 195, 247, 0.6); }\n        .marker-dot.edge { background: #FF9800; box-shadow: 0 0 12px rgba(255, 152, 0, 0.6); }\n        .marker-dot.compute { background: #FF5252; box-shadow: 0 0 12px rgba(255, 82, 82, 0.6); }\n\n        .marker-dot::after {\n            content: '';\n            position: absolute;\n            top: -4px; left: -4px;\n            width: 24px; height: 24px;\n            border-radius: 50%;\n            border: 2px solid currentColor;\n            opacity: 0.4;\n        }\n\n        .marker-dot.user::after { border-color: #4FC3F7; }\n        .marker-dot.edge::after { border-color: #FF9800; }\n        .marker-dot.compute::after { border-color: #FF5252; }\n\n        .marker-tooltip {\n            position: absolute;\n            top: -32px;\n            left: 50%;\n            transform: translateX(-50%);\n            background: var(--bg-secondary);\n            color: var(--text-primary);\n            padding: 2px 8px;\n            border-radius: 4px;\n            font-size: 0.7rem;\n            font-weight: 600;\n            white-space: nowrap;\n            border: 1px solid var(--border-color);\n            pointer-events: none;\n        }\n\n        .latency-tag {\n            background: var(--bg-secondary);\n            padding: 3px 8px;\n            border-radius: 4px;\n            font-size: 0.75rem;\n            font-weight: 600;\n            border: 1px solid var(--border-color);\n            white-space: nowrap;\n            box-shadow: 0 2px 8px rgba(0,0,0,0.4);\n        }\n\n        .latency-tag.user-edge { color: #4FC3F7; }\n        .latency-tag.edge-compute { color: #FF9800; }\n\n        @media (max-width: 768px) {\n            h1 { font-size: 1.8rem; }\n            .results-grid { grid-template-columns: 1fr; }\n            .tab { padding: 0.75rem\
    \ 1rem; font-size: 0.9rem; }\n            .map-info { grid-template-columns: 1fr; }\n            .breakdown-grid { grid-template-columns: repeat(2, 1fr); }\n            #map { height: 350px; }\n        }\n    </style>\n</head>\n<body>\n    <div class=\"container\">\n        <header>\n            <h1>Mortgage Product Intelligence</h1>\n            <p class=\"subtitle\">AI-Powered Personalization on <a href=\"#\">Akamai Cloud Computing</a></p>\n        </header>\n\n        <!-- Connection config -->\n        <div class=\"config-panel\">\n            <div class=\"config-row\">\n                <div class=\"input-group\">\n                    <label for=\"endpoint\">Inference Endpoint</label>\n                    <input type=\"text\" id=\"endpoint\" placeholder=\"https://mortgage-inference.connected-cloud.io\" value=\"https://mortgage-inference.connected-cloud.io\">\n                </div>\n                <div style=\"display:flex; gap:0.75rem; align-items:flex-end;\">\n                    <button class=\"btn btn-secondary\" id=\"testConnection\">Test Connection</button>\n                    <span class=\"connection-status disconnected\" id=\"connectionStatus\">\n                        <span class=\"status-dot\"></span> Disconnected\n                    </span>\n                </div>\n            </div>\n        </div>\n\n        <!-- Tabs -->\n        <div class=\"tabs\">\n            <div class=\"tab active\" data-tab=\"classify\">Get Recommendations</div>\n            <div class=\"tab\" data-tab=\"match\">Find Similar Borrowers</div>\n            <div class=\"tab\" data-tab=\"perf\">Performance</div>\n            <div class=\"tab\" data-tab=\"edgemap\">Edge Map</div>\n        </div>\n\n        <!-- CLASSIFY TAB -->\n        <div class=\"tab-content active\" id=\"tab-classify\">\n            <div class=\"input-area\">\n                <label for=\"classifyInput\">Describe your homebuying situation</label>\n                <textarea id=\"classifyInput\" rows=\"3\" placeholder=\"e.g., First-time buyer, $75,000 income, credit score around 680, looking for a home in the Detroit suburbs with a small down payment...\"></textarea>\n                <div class=\"sample-chips\">\n                    <span style=\"color: var(--text-secondary); font-size: 0.8rem; margin-right: 0.25rem;\">Try:</span>\n                    <span class=\"chip\" data-target=\"classifyInput\" data-text=\"First-time buyer, single, earning $65,000 as a teacher. Credit score 640 with student loans. Looking for a starter home around $180,000 near Detroit. Only have about $8,000 saved for down payment.\">First-time buyer</span>\n                    <span class=\"chip\" data-target=\"classifyInput\" data-text=\"Army veteran, 10 years of service. Currently working as an electrician earning $72,000. Credit score 710. Looking for a family home around $250,000 in Grand Rapids. No down payment saved.\">Military veteran</span>\n                    <span class=\"chip\" data-target=\"classifyInput\" data-text=\"Dual income household, both physicians, combined income $400,000. Excellent credit above 780. Looking for a luxury home around $1,000,000 in Bloomfield Hills. Have $200,000 for down payment.\">High-income luxury</span>\n                    <span class=\"chip\" data-target=\"classifyInput\" data-text=\"Family of four, household income $55,000. Looking for an affordable home in rural northern Michigan around $150,000. Income is below the area median. Want a quiet small-town community.\">Rural affordable</span>\n                </div>\n                <div class=\"action-row\">\n                    <button class=\"btn btn-primary\" id=\"classifyBtn\">Get Recommendations</button>\n                    <span class=\"latency-display\" id=\"classifyLatency\"></span>\n                </div>\n            </div>\n\n            <div id=\"classifyResults\">\n                <div class=\"placeholder\">\n                    <h3>Describe your situation above</h3>\n                    <p>Our AI will analyze your profile and recommend the best mortgage products, ranked by fit.</p>\n                </div>\n            </div>\n        </div>\n\n        <!-- MATCH TAB -->\n        <div class=\"tab-content\" id=\"tab-match\">\n            <div class=\"input-area\">\n                <label for=\"matchInput\">Describe the borrower profile to match</label>\n                <textarea id=\"matchInput\" rows=\"3\" placeholder=\"e.g., Married couple, combined income $110,000, credit score 720, looking to upgrade from a starter condo to a 4-bedroom home around $350,000...\"></textarea>\n                <div class=\"sample-chips\">\n                    <span style=\"color: var(--text-secondary); font-size: 0.8rem; margin-right: 0.25rem;\">Try:</span>\n                    <span class=\"chip\" data-target=\"matchInput\" data-text=\"Young married couple, combined income around $90,000. First-time buyers with credit scores in the low 600s. Looking for a family home around $200,000 in the Dearborn area. Limited savings for down payment.\">Young couple, Dearborn</span>\n                    <span class=\"chip\" data-target=\"matchInput\" data-text=\"Single professional, software developer earning $125,000. Excellent credit score. Has substantial savings for down payment. Looking for a modern condo in downtown Detroit.\">Tech professional</span>\n                    <span class=\"chip\" data-target=\"matchInput\" data-text=\"Retired military officer looking for a single-story home near the VA hospital. Pension and part-time consulting income around $80,000.\">Retired veteran</span>\n                </div>\n                <div class=\"action-row\">\n                    <button class=\"btn btn-primary\" id=\"matchBtn\">Find Similar Borrowers</button>\n                    <div style=\"display:flex; align-items:center; gap:1rem; margin-left:auto;\">\n                        <label for=\"topK\" style=\"margin:0; white-space:nowrap;\">Top K:</label>\n                        <input type=\"number\" id=\"topK\" value=\"5\" min=\"1\" max=\"25\" style=\"width:60px;\">\n                        <span class=\"latency-display\" id=\"matchLatency\"></span>\n                    </div>\n                </div>\n            </div>\n\n            <div id=\"matchResults\">\n                <div class=\"placeholder\">\n                    <h3>Describe a borrower profile above</h3>\n                    <p>Our AI will find the most similar borrower profiles from our database and show their mortgage outcomes.</p>\n                </div>\n            </div>\n        </div>\n\n        <!-- PERFORMANCE TAB -->\n        <div class=\"tab-content\" id=\"tab-perf\">\n            <div class=\"stats-grid\">\n                <div class=\"stat-card\">\n                    <div class=\"stat-value classify\" id=\"classifyCount\">0</div>\n                    <div class=\"stat-label\">Classifications</div>\n                </div>\n                <div class=\"stat-card\">\n                    <div class=\"stat-value match\" id=\"matchCount\">0</div>\n                    <div class=\"stat-label\">Profile Matches</div>\n                </div>\n                <div class=\"stat-card\">\n                    <div class=\"stat-value latency\" id=\"avgLatency\">--</div>\n                    <div class=\"stat-label\">Avg Latency</div>\n                </div>\n                <div class=\"stat-card\">\n                    <div class=\"stat-value success\" id=\"successRate\">--</div>\n                    <div class=\"stat-label\">Success Rate</div>\n                </div>\n            </div>\n\n            <div class=\"perf-panel\">\n                <div class=\"perf-body\">\n                    <div class=\"chart-container\">\n                        <canvas id=\"latencyChart\"></canvas>\n                    </div>\n                </div>\n            </div>\n\n            <div class=\"perf-panel\" style=\"margin-top:1rem;\">\n                <div class=\"perf-header\">\n                    <span style=\"font-weight:600;\">Request Log</span>\n                    <span style=\"color:var(--text-secondary); font-size:0.85rem;\" id=\"logCount\">0 requests</span>\n                </div>\n                <div style=\"max-height:300px; overflow-y:auto; padding:0;\" id=\"requestLog\">\n                    <div style=\"padding:2rem; text-align:center; color:var(--text-secondary);\">No requests yet.</div>\n                </div>\n            </div>\n        </div>\n\n        <!-- EDGE MAP TAB -->\n        <div class=\"tab-content\" id=\"tab-edgemap\">\n            <div class=\"map-container\">\n                <div class=\"map-header\">\n                    <h3>Edge Network Topology</h3>\n                    <button class=\"detect-btn\" id=\"detectLocationBtn\">Detect My Location</button>\n                </div>\n                <div id=\"map\"></div>\n                <div class=\"map-legend\">\n                    <div class=\"map-legend-item\">\n                        <div class=\"map-legend-dot user\"></div>\n                        <span>Your Location</span>\n                    </div>\n                    <div class=\"map-legend-item\">\n                        <div class=\"map-legend-dot edge\"></div>\n                        <span>Akamai Edge Server</span>\n                    </div>\n                    <div class=\"map-legend-item\">\n                        <div class=\"map-legend-dot compute\"></div>\n                        <span>GPU Compute (us-ord)</span>\n                    </div>\n                </div>\n                <div class=\"map-info\">\n                    <div class=\"location-card\">\n                        <div class=\"location-label\">Your Location</div>\n                        <div class=\"location-name user-loc\" id=\"userLocName\">Click \"Detect My Location\"</div>\n                        <div class=\"location-detail\" id=\"userLocDetail\">Browser Geolocation API (opt-in)</div>\n                    </div>\n\
    \                    <div class=\"location-card edge-card\">\n                        <div class=\"location-label\">Akamai Edge Server</div>\n                        <div class=\"location-name edge-loc\" id=\"edgeLocName\">Detecting...</div>\n                        <div class=\"location-detail\" id=\"edgeLocDetail\">Nearest Akamai CDN POP</div>\n                    </div>\n                    <div class=\"location-card compute-card\">\n                        <div class=\"location-label\">GPU Compute</div>\n                        <div class=\"location-name compute-loc\">Chicago, IL</div>\n                        <div class=\"location-detail\">LKE us-ord &middot; RTX 4000 &middot; BERT ONNX</div>\n                    </div>\n                </div>\n            </div>\n\n            <div class=\"latency-breakdown\">\n                <h3>Network Path Latency</h3>\n                <div class=\"hint\">Send a query on the Recommendations or Borrowers tab to measure latency</div>\n                <div class=\"breakdown-grid\">\n                    <div class=\"breakdown-item\">\n                        <div class=\"breakdown-value\" style=\"color:#4FC3F7;\" id=\"legUserEdge\">--</div>\n                        <div class=\"breakdown-label\">User &rarr; Edge</div>\n                    </div>\n                    <div class=\"breakdown-item\">\n                        <div class=\"breakdown-value\" style=\"color:#FF9800;\" id=\"legEdgeCompute\">--</div>\n                        <div class=\"breakdown-label\">Edge &rarr; Compute</div>\n                    </div>\n                    <div class=\"breakdown-item\">\n                        <div class=\"breakdown-value\" style=\"color:#a371f7;\" id=\"legServerProc\">--</div>\n                        <div class=\"breakdown-label\">GPU Inference</div>\n                    </div>\n                    <div class=\"breakdown-item\">\n                        <div class=\"breakdown-value\" style=\"color:#3fb950;\" id=\"legTotal\">--</div>\n                        <div class=\"breakdown-label\">Total Round Trip</div>\n                    </div>\n                </div>\n            </div>\n        </div>\n    </div>\n\n    <script>\n        // Auth token \u2014 passed as query param on all API calls\n        // Set via URL hash: index.html#token=YOUR_TOKEN or enter in the UI\n        const urlParams = new URLSearchParams(window.location.hash.slice(1));\n        let AUTH_TOKEN = urlParams.get('token') || '';\n        function authQuery() { return AUTH_TOKEN ? `?auth=${AUTH_TOKEN}` : ''; }\n\n        // State\n        let isConnected = false;\n        let requestHistory = [];\n        let latencyData = { classify: [], match: [], labels: [] };\n        const MAX_POINTS = 60;\n\n        // Chart\n        const ctx = document.getElementById('latencyChart').getContext('2d');\n        const chart = new Chart(ctx, {\n            type: 'line',\n            data: {\n                labels: [],\n                datasets: [\n                    {\n                        label: 'Classify',\n                        data: [],\n                        borderColor: '#e63946',\n                        backgroundColor: 'rgba(230, 57, 70, 0.1)',\n                        fill: true, tension: 0.3, pointRadius: 2\n                    },\n                    {\n                        label: 'Match',\n                        data: [],\n                        borderColor: '#a371f7',\n                        backgroundColor: 'rgba(163, 113, 247, 0.1)',\n                        fill: true, tension: 0.3, pointRadius: 2\n                    }\n                ]\n            },\n            options: {\n                responsive: true,\n                maintainAspectRatio: false,\n                interaction: { intersect: false, mode: 'index' },\n                plugins: {\n                    legend: { labels: { color: '#8b949e' } },\n                    tooltip: {\n                        backgroundColor: '#21262d',\n                        titleColor: '#e6edf3',\n                        bodyColor: '#8b949e',\n                        borderColor: '#30363d',\n                        borderWidth: 1,\n                        callbacks: {\n                            label: ctx => ctx.dataset.label + ': ' + (ctx.raw !== null ? ctx.raw.toFixed(1) + ' ms' : 'N/A')\n                        }\n                    }\n                },\n                scales: {\n                    x: { grid: { color: 'rgba(48,54,61,0.5)' }, ticks: { color: '#8b949e', maxTicksLimit: 10 } },\n                    y: {\n                        beginAtZero: true,\n                        grid: { color: 'rgba(48,54,61,0.5)' },\n                        ticks: { color: '#8b949e', callback: v => v + ' ms' }\n                    }\n                }\n            }\n        });\n\n        // DOM\n        const endpointInput = document.getElementById('endpoint');\n        const connStatus = document.getElementById('connectionStatus');\n\n        function getEndpoint() { return endpointInput.value.replace(/\\/$/, ''); }\n        function apiUrl(path) { return `${getEndpoint()}${path}${authQuery()}`; }\n\n        function setConnStatus(status, msg) {\n            connStatus.className = `connection-status ${status}`;\n            connStatus.innerHTML = `<span class=\"status-dot\"></span> ${msg}`;\n            isConnected = status === 'connected';\n        }\n\n        // Tabs \u2014 handler registered at bottom of script (includes edge map init)\n\n        // Chips\n        document.querySelectorAll('.chip').forEach(chip => {\n            chip.addEventListener('click', () => {\n                const target = document.getElementById(chip.dataset.target);\n                target.value = chip.dataset.text;\n                target.focus();\n            });\n        });\n\n        // Test connection\n        document.getElementById('testConnection').addEventListener('click', async () => {\n            setConnStatus('testing', 'Testing...');\n            try {\n                const r = await fetch(apiUrl('/health'));\n                if (r.ok) {\n                    const d = await r.json();\n                    setConnStatus(d.status === 'healthy' ? 'connected' : 'disconnected',\n                        d.status === 'healthy' ? 'Connected' : 'Unhealthy');\n                } else {\n                    setConnStatus('disconnected', `Error ${r.status}`);\n                }\n            } catch (e) {\n                setConnStatus('disconnected', 'Connection Failed');\n            }\n        });\n\n        // Classify\n        document.getElementById('classifyBtn').addEventListener('click', async () => {\n            const text = document.getElementById('classifyInput').value.trim();\n            if (!text) return;\n\n            const btn = document.getElementById('classifyBtn');\n            btn.disabled = true;\n            btn.textContent = 'Analyzing...';\n\n            const start = performance.now();\n            try {\n                const r = await fetch(apiUrl('/v1/classify'), {\n                    method: 'POST',\n                    headers: { 'Content-Type': 'application/json' },\n                    body: JSON.stringify({ text })\n                });\n                const elapsed = performance.now() - start;\n\n                if (r.ok) {\n                    const st = parseServerTiming(r);\n                    const data = await r.json();\n                    renderClassifyResults(data);\n                    document.getElementById('classifyLatency').innerHTML =\n                        `<strong>${data.latency_ms.toFixed(1)} ms</strong> server &middot; ${elapsed.toFixed(0)} ms round-trip`;\n                    recordRequest('classify', elapsed, data.latency_ms, true, text, st);\n                    if (!isConnected) setConnStatus('connected', 'Connected');\n                } else {\n                    document.getElementById('classifyResults').innerHTML =\n                        `<div class=\"placeholder\"><h3>Error ${r.status}</h3><p>${await r.text()}</p></div>`;\n                    recordRequest('classify', elapsed, 0, false, text);\n                }\n            } catch (e) {\n                document.getElementById('classifyResults').innerHTML =\n                    `<div class=\"placeholder\"><h3>Connection Failed</h3><p>${e.message}</p></div>`;\n                recordRequest('classify', performance.now() - start, 0, false, text);\n            }\n            btn.disabled = false;\n            btn.textContent = 'Get Recommendations';\n        });\n\n        function renderClassifyResults(data) {\n            const container = document.getElementById('classifyResults');\n            container.innerHTML = '<div class=\"results-grid\">' +\n                data.recommendations.map((rec, i) => {\n                    const pct = (rec.confidence * 100).toFixed(1);\n                    const color = i === 0 ? 'var(--accent-red)' :\n                                  i === 1 ? 'var(--accent-coral)' :\n                                  'var(--text-secondary)';\n                    return `\n                    <div class=\"product-card ${i === 0 ? 'top-pick' : ''}\">\n                        <div class=\"product-card-header\">\n                            <span class=\"product-name\">${rec.product}</span>\n                            <span class=\"product-badge ${i === 0 ? 'top' : 'alt'}\">${i === 0 ? 'Best Fit' : '#' + (i+1)}</span>\n                        </div>\n                        <div class=\"confidence-text\">Confidence: <strong>${pct}%</strong></div>\n                        <div class=\"confidence-bar\">\n                            <div class=\"confidence-fill\" style=\"width:${pct}%; background:${color};\"></div>\n                        </div>\n                        <div class=\"product-details\">\n                            <div class=\"detail-row\"><span>Min Credit Score</span><span>${rec.min_credit_score}</span></div>\n\
    \                            <div class=\"detail-row\"><span>Min Down Payment</span><span>${rec.min_down_payment_pct}%</span></div>\n                        </div>\n                        <div class=\"highlights\">\n                            ${rec.highlights.map(h => `<span class=\"highlight-tag\">${h}</span>`).join('')}\n                        </div>\n                    </div>`;\n                }).join('') +\n                '</div>';\n        }\n\n        // Match\n        document.getElementById('matchBtn').addEventListener('click', async () => {\n            const text = document.getElementById('matchInput').value.trim();\n            if (!text) return;\n\n            const topK = parseInt(document.getElementById('topK').value) || 5;\n            const btn = document.getElementById('matchBtn');\n            btn.disabled = true;\n            btn.textContent = 'Searching...';\n\n            const start = performance.now();\n            try {\n                const r = await fetch(apiUrl('/v1/match'), {\n                    method: 'POST',\n                    headers: { 'Content-Type': 'application/json' },\n                    body: JSON.stringify({ text, top_k: topK })\n                });\n                const elapsed = performance.now() - start;\n\n                if (r.ok) {\n                    const st = parseServerTiming(r);\n                    const data = await r.json();\n                    renderMatchResults(data);\n                    document.getElementById('matchLatency').innerHTML =\n                        `<strong>${data.latency_ms.toFixed(1)} ms</strong> server &middot; ${elapsed.toFixed(0)} ms round-trip`;\n                    recordRequest('match', elapsed, data.latency_ms, true, text, st);\n                    if (!isConnected) setConnStatus('connected', 'Connected');\n                } else {\n                    document.getElementById('matchResults').innerHTML =\n                        `<div class=\"placeholder\"><h3>Error ${r.status}</h3><p>${await r.text()}</p></div>`;\n                    recordRequest('match', elapsed, 0, false, text);\n                }\n            } catch (e) {\n                document.getElementById('matchResults').innerHTML =\n                    `<div class=\"placeholder\"><h3>Connection Failed</h3><p>${e.message}</p></div>`;\n                recordRequest('match', performance.now() - start, 0, false, text);\n            }\n            btn.disabled = false;\n            btn.textContent = 'Find Similar Borrowers';\n        });\n\n        function renderMatchResults(data) {\n            const container = document.getElementById('matchResults');\n            container.innerHTML = data.matches.map((m, i) => {\n                const simPct = (m.similarity * 100).toFixed(1);\n                const simClass = m.similarity > 0.85 ? 'high' : m.similarity > 0.7 ? 'medium' : 'low';\n                const p = m.profile;\n                return `\n                <div class=\"match-card\">\n                    <div class=\"match-card-header\">\n                        <span class=\"match-name\">${p.name}</span>\n                        <span class=\"similarity-badge similarity-${simClass}\">${simPct}% match</span>\n                    </div>\n                    <div class=\"match-meta\">\n                        <span>${p.mortgage_product}</span>\n                        <span>$${p.loan_amount.toLocaleString()}</span>\n                        <span>${p.rate}% rate</span>\n                        <span>${p.term_years}yr</span>\n                        <span>${p.location}</span>\n                    </div>\n                    <div class=\"match-description\">${p.description}</div>\n                    <div class=\"match-outcome\">${p.outcome}</div>\n                </div>`;\n            }).join('');\n        }\n\n        // Performance tracking\n        function recordRequest(type, httpMs, serverMs, success, text, serverTiming) {\n            const entry = { type, httpMs, serverMs, success, text, time: new Date() };\n            requestHistory.unshift(entry);\n            if (requestHistory.length > 200) requestHistory.pop();\n\n            // Chart\n            const label = entry.time.toLocaleTimeString('en-US', { hour12: false, hour:'2-digit', minute:'2-digit', second:'2-digit' });\n            latencyData.labels.push(label);\n            latencyData.classify.push(type === 'classify' && success ? serverMs : null);\n            latencyData.match.push(type === 'match' && success ? serverMs : null);\n            if (latencyData.labels.length > MAX_POINTS) {\n                latencyData.labels.shift();\n                latencyData.classify.shift();\n                latencyData.match.shift();\n            }\n            chart.data.labels = latencyData.labels;\n            chart.data.datasets[0].data = latencyData.classify;\n            chart.data.datasets[1].data = latencyData.match;\n            chart.update('none');\n\n            // Stats\n            const classifyReqs = requestHistory.filter(r => r.type === 'classify');\n            const matchReqs = requestHistory.filter(r => r.type === 'match');\n            const successReqs = requestHistory.filter(r => r.success);\n            document.getElementById('classifyCount').textContent = classifyReqs.length;\n            document.getElementById('matchCount').textContent = matchReqs.length;\n\n            if (successReqs.length > 0) {\n                const avg = successReqs.reduce((s, r) => s + r.serverMs, 0) / successReqs.length;\n                document.getElementById('avgLatency').textContent = avg.toFixed(1) + ' ms';\n            }\n\n            const total = requestHistory.length;\n            const successPct = total > 0 ? ((successReqs.length / total) * 100).toFixed(0) : '--';\n            document.getElementById('successRate').textContent = successPct === '--' ? '--' : successPct + '%';\n\n            // Log\n            renderLog();\n\n            // Update edge map latency breakdown\n            if (success && typeof updateMapLatency === 'function') {\n                updateMapLatency(httpMs, serverMs, serverTiming || null);\n            }\n        }\n\n        function renderLog() {\n            const log = document.getElementById('requestLog');\n            if (requestHistory.length === 0) {\n                log.innerHTML = '<div style=\"padding:2rem; text-align:center; color:var(--text-secondary);\">No requests yet.</div>';\n                return;\n            }\n            log.innerHTML = requestHistory.slice(0, 50).map(r => {\n                const typeColor = r.type === 'classify' ? 'var(--accent-red)' : 'var(--accent-purple)';\n                const statusColor = r.success ? 'var(--accent-green)' : 'var(--accent-coral)';\n                const time = r.time.toLocaleTimeString('en-US', { hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit' });\n                return `<div style=\"padding:0.6rem 1.25rem; border-bottom:1px solid var(--border-color); display:flex; gap:1rem; align-items:center; font-size:0.85rem;\">\n                    <span style=\"width:8px; height:8px; border-radius:50%; background:${statusColor}; flex-shrink:0;\"></span>\n                    <span style=\"color:${typeColor}; font-weight:600; width:60px; flex-shrink:0;\">${r.type}</span>\n                    <span style=\"flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-secondary);\" title=\"${r.text}\">${r.text}</span>\n                    <span style=\"color:var(--accent-coral); font-weight:600; flex-shrink:0;\">${r.serverMs.toFixed(1)} ms</span>\n                    <span style=\"color:var(--text-secondary); flex-shrink:0; font-size:0.75rem;\">${time}</span>\n                </div>`;\n            }).join('');\n            document.getElementById('logCount').textContent = `${requestHistory.length} requests`;\n        }\n\n        // Auto-test on load\n        if (endpointInput.value) {\n            setTimeout(() => document.getElementById('testConnection').click(), 500);\n        }\n\n        // ========================\n        // Edge Map\n        // ========================\n        const computeCoords = { lat: 41.8781, lng: -87.6298 };\n        let userCoords = null;\n        let edgeCoords = null;\n        let edgeMap = null;\n        let mapMarkers = {};\n        let mapLines = [];\n        let mapLatencyTags = [];\n        let mapInitialized = false;\n\n        function initEdgeMap() {\n            if (mapInitialized) return;\n            edgeMap = L.map('map', { center: [39.8283, -98.5795], zoom: 4, zoomControl: true });\n            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {\n                attribution: '\\u00a9 OSM \\u00a9 CARTO',\n                subdomains: 'abcd',\n                maxZoom: 19\n            }).addTo(edgeMap);\n\n            // Add compute marker immediately\n            addMapMarker('compute', computeCoords.lat, computeCoords.lng, 'Chicago, IL');\n            mapInitialized = true;\n\n            // Detect edge server\n            detectEdgeServer();\n        }\n\n        function createMarkerIcon(type, label) {\n            return L.divIcon({\n                className: 'custom-marker',\n                html: '<div class=\"marker-dot ' + type + '\"><div class=\"marker-tooltip\">' + label + '</div></div>',\n                iconSize: [16, 16],\n                iconAnchor: [8, 8]\n            });\n        }\n\n        function addMapMarker(type, lat, lng, label) {\n            if (mapMarkers[type]) edgeMap.removeLayer(mapMarkers[type]);\n            mapMarkers[type] = L.marker([lat, lng], { icon: createMarkerIcon(type, label) }).addTo(edgeMap);\n        }\n\n        function clearMapLines() {\n            mapLines.forEach(l => edgeMap.removeLayer(l));\n            mapLatencyTags.forEach(l => edgeMap.removeLayer(l));\n            mapLines = [];\n            mapLatencyTags = [];\n        }\n\n        function\
    \ drawMapPath() {\n            if (!edgeMap) return;\n            clearMapLines();\n\n            const points = [];\n            if (userCoords) points.push([userCoords.lat, userCoords.lng]);\n            if (edgeCoords) points.push([edgeCoords.lat, edgeCoords.lng]);\n            points.push([computeCoords.lat, computeCoords.lng]);\n\n            if (userCoords && edgeCoords) {\n                mapLines.push(L.polyline(\n                    [[userCoords.lat, userCoords.lng], [edgeCoords.lat, edgeCoords.lng]],\n                    { color: '#4FC3F7', weight: 2, opacity: 0.7, dashArray: '8, 6' }\n                ).addTo(edgeMap));\n                mapLines.push(L.polyline(\n                    [[edgeCoords.lat, edgeCoords.lng], [computeCoords.lat, computeCoords.lng]],\n                    { color: '#FF9800', weight: 2, opacity: 0.7, dashArray: '8, 6' }\n                ).addTo(edgeMap));\n            } else if (userCoords) {\n                mapLines.push(L.polyline(\n                    [[userCoords.lat, userCoords.lng], [computeCoords.lat, computeCoords.lng]],\n                    { color: '#a371f7', weight: 2, opacity: 0.7, dashArray: '8, 6' }\n                ).addTo(edgeMap));\n            }\n\n            if (points.length >= 2) {\n                edgeMap.fitBounds(points, { padding: [60, 60] });\n            }\n        }\n\n        function haversineKm(lat1, lon1, lat2, lon2) {\n            const R = 6371;\n            const dLat = (lat2 - lat1) * Math.PI / 180;\n            const dLon = (lon2 - lon1) * Math.PI / 180;\n            const a = Math.sin(dLat/2)**2 +\n                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *\n                      Math.sin(dLon/2)**2;\n            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));\n        }\n\n        function addLatencyTag(latlng, text, cssClass) {\n            const tag = L.marker(latlng, {\n                icon: L.divIcon({\n                    className: '',\n                    html: '<div class=\"latency-tag ' + cssClass + '\">' + text + '</div>',\n                    iconSize: [80, 20],\n                    iconAnchor: [40, 10]\n                })\n            }).addTo(edgeMap);\n            mapLatencyTags.push(tag);\n        }\n\n        // Parse Akamai server-timing headers from fetch response\n        function parseServerTiming(response) {\n            const timings = { edge: null, origin: null };\n            const stHeaders = response.headers.get('server-timing');\n            if (!stHeaders) return timings;\n            // server-timing can arrive as multiple comma-separated entries in one header\n            // or as multiple headers (combined by fetch as comma-separated)\n            stHeaders.split(',').forEach(entry => {\n                const trimmed = entry.trim();\n                const durMatch = trimmed.match(/dur=([\\d.]+)/);\n                const dur = durMatch ? parseFloat(durMatch[1]) : null;\n                if (trimmed.startsWith('edge')) timings.edge = dur;\n                if (trimmed.startsWith('origin')) timings.origin = dur;\n            });\n            return timings;\n        }\n\n        function updateMapLatency(httpMs, serverMs, serverTiming) {\n            if (!mapInitialized) return;\n\n            document.getElementById('legServerProc').textContent = serverMs.toFixed(1) + ' ms';\n            document.getElementById('legTotal').textContent = httpMs.toFixed(0) + ' ms';\n\n            // Remove old latency tags\n            mapLatencyTags.forEach(l => edgeMap.removeLayer(l));\n            mapLatencyTags = [];\n\n            // Use Akamai server-timing headers for real latency breakdown\n            // edge;dur=X  = processing time on Akamai edge (TLS, rules, etc.)\n            // origin;dur=Y = round-trip from edge to origin (network + compute)\n            // User\u2192Edge = total HTTP time - origin time - edge processing\n            // Edge\u2192Compute = origin time - inference server time\n            if (serverTiming && serverTiming.origin !== null) {\n                const edgeProc = serverTiming.edge || 0;\n                const originRtt = serverTiming.origin || 0;\n                const userEdgeMs = Math.max(0, httpMs - originRtt - edgeProc);\n                const edgeComputeMs = Math.max(0, originRtt - serverMs);\n\n                document.getElementById('legUserEdge').textContent = userEdgeMs.toFixed(1) + ' ms';\n                document.getElementById('legEdgeCompute').textContent = edgeComputeMs.toFixed(1) + ' ms';\n\n                if (userCoords && edgeCoords) {\n                    addLatencyTag(\n                        [(userCoords.lat + edgeCoords.lat) / 2, (userCoords.lng + edgeCoords.lng) / 2],\n                        userEdgeMs.toFixed(0) + ' ms', 'user-edge'\n                    );\n                    addLatencyTag(\n                        [(edgeCoords.lat + computeCoords.lat) / 2, (edgeCoords.lng + computeCoords.lng) / 2],\n                        edgeComputeMs.toFixed(0) + ' ms', 'edge-compute'\n                    );\n                }\n            } else if (userCoords && edgeCoords) {\n                // Fallback: estimate from haversine distance\n                const networkRtt = Math.max(0, httpMs - serverMs);\n                const dUE = haversineKm(userCoords.lat, userCoords.lng, edgeCoords.lat, edgeCoords.lng);\n                const dEC = haversineKm(edgeCoords.lat, edgeCoords.lng, computeCoords.lat, computeCoords.lng);\n                const totalDist = dUE + dEC;\n                const userEdgeMs = totalDist > 0 ? (networkRtt / 2) * (dUE / totalDist) : networkRtt / 4;\n                const edgeComputeMs = totalDist > 0 ? (networkRtt / 2) * (dEC / totalDist) : networkRtt / 4;\n                document.getElementById('legUserEdge').textContent = '~' + userEdgeMs.toFixed(1) + ' ms';\n                document.getElementById('legEdgeCompute').textContent = '~' + edgeComputeMs.toFixed(1) + ' ms';\n                addLatencyTag(\n                    [(userCoords.lat + edgeCoords.lat) / 2, (userCoords.lng + edgeCoords.lng) / 2],\n                    '~' + userEdgeMs.toFixed(0) + ' ms', 'user-edge'\n                );\n                addLatencyTag(\n                    [(edgeCoords.lat + computeCoords.lat) / 2, (edgeCoords.lng + computeCoords.lng) / 2],\n                    '~' + edgeComputeMs.toFixed(0) + ' ms', 'edge-compute'\n                );\n            } else {\n                document.getElementById('legUserEdge').textContent = 'N/A';\n                document.getElementById('legEdgeCompute').textContent = 'N/A';\n            }\n        }\n\n        // Detect Akamai edge server location from X-Edge-Location response header\n        // Geolocates via ipapi.is (free, HTTPS, CORS-safe)\n        async function detectEdgeServer() {\n            try {\n                // Read edge server IP from Akamai's X-Edge-Location header\n                const probeResp = await fetch(apiUrl('/health'), { method: 'GET' });\n                let edgeIp = probeResp.headers.get('X-Edge-Location');\n\n                // Fallback: resolve hostname via Cloudflare DNS-over-HTTPS\n                if (!edgeIp) {\n                    const hostname = new URL(getEndpoint()).hostname;\n                    const dnsResp = await fetch(\n                        'https://cloudflare-dns.com/dns-query?name=' + encodeURIComponent(hostname) + '&type=A',\n                        { headers: { 'Accept': 'application/dns-json' } }\n                    );\n                    const dns = await dnsResp.json();\n                    const aRecord = (dns.Answer || []).find(r => r.type === 1);\n                    if (!aRecord) {\n                        document.getElementById('edgeLocName').textContent = 'No edge detected';\n                        document.getElementById('edgeLocDetail').textContent = 'DNS resolution returned no A record';\n                        return;\n                    }\n                    edgeIp = aRecord.data;\n                }\n\n                // Geolocate the edge IP via ipapi.is (free, HTTPS, CORS-safe)\n                const geoResp = await fetch('https://api.ipapi.is/?q=' + edgeIp);\n                const geo = await geoResp.json();\n                const loc = geo.location || {};\n                if (!loc.latitude) {\n                    document.getElementById('edgeLocName').textContent = edgeIp;\n                    document.getElementById('edgeLocDetail').textContent = 'Geolocation unavailable';\n                    return;\n                }\n\n                edgeCoords = { lat: loc.latitude, lng: loc.longitude };\n                const cityName = [loc.city, loc.state].filter(Boolean).join(', ');\n                document.getElementById('edgeLocName').textContent = cityName || edgeIp;\n                document.getElementById('edgeLocDetail').textContent =\n                    (geo.company?.name || 'Akamai CDN') + ' \\u00b7 ' + edgeIp;\n\n                addMapMarker('edge', edgeCoords.lat, edgeCoords.lng, cityName || 'Akamai Edge');\n                drawMapPath();\n            } catch (e) {\n                console.error('Edge detection failed:', e);\n                document.getElementById('edgeLocName').textContent = 'Detection failed';\n                document.getElementById('edgeLocDetail').textContent = e.message;\n            }\n        }\n\n        async function getUserLocation() {\n            const btn = document.getElementById('detectLocationBtn');\n            btn.disabled = true;\n            btn.textContent = 'Detecting...';\n\n            if (!('geolocation' in navigator)) {\n                document.getElementById('userLocName').textContent = 'Not supported';\n                document.getElementById('userLocDetail').textContent = 'Browser does not support Geolocation API';\n                btn.disabled = false;\n                btn.textContent = 'Detect My Location';\n                return;\n            }\n\n       \
    \     try {\n                const pos = await new Promise((resolve, reject) => {\n                    navigator.geolocation.getCurrentPosition(resolve, reject, {\n                        enableHighAccuracy: false, timeout: 10000\n                    });\n                });\n\n                userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };\n                let cityName = userCoords.lat.toFixed(2) + '\\u00b0N, ' + Math.abs(userCoords.lng).toFixed(2) + '\\u00b0W';\n\n                // Reverse geocode\n                try {\n                    const r = await fetch(\n                        'https://nominatim.openstreetmap.org/reverse?lat=' + userCoords.lat +\n                        '&lon=' + userCoords.lng + '&format=json'\n                    );\n                    const data = await r.json();\n                    const city = data.address.city || data.address.town || data.address.village || '';\n                    const state = data.address.state || '';\n                    if (city) cityName = [city, state].filter(Boolean).join(', ');\n                } catch (e) { /* reverse geocode failed, use coords */ }\n\n                document.getElementById('userLocName').textContent = cityName;\n                document.getElementById('userLocDetail').textContent =\n                    userCoords.lat.toFixed(4) + ', ' + userCoords.lng.toFixed(4);\n\n                addMapMarker('user', userCoords.lat, userCoords.lng, cityName);\n                drawMapPath();\n                btn.textContent = 'Location Detected';\n            } catch (e) {\n                document.getElementById('userLocName').textContent = 'Access denied';\n                document.getElementById('userLocDetail').textContent = 'Enable location access to see your position';\n                btn.disabled = false;\n                btn.textContent = 'Detect My Location';\n            }\n        }\n\n        // Detect My Location button\n        document.getElementById('detectLocationBtn').addEventListener('click', getUserLocation);\n\n        // Initialize map when Edge Map tab is first shown\n        const origTabHandler = function() {\n            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));\n            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));\n            this.classList.add('active');\n            document.getElementById('tab-' + this.dataset.tab).classList.add('active');\n            if (this.dataset.tab === 'edgemap') {\n                initEdgeMap();\n                setTimeout(() => { if (edgeMap) edgeMap.invalidateSize(); }, 100);\n            }\n        };\n        document.querySelectorAll('.tab').forEach(tab => {\n            // Remove old listeners by replacing node\n            const newTab = tab.cloneNode(true);\n            tab.parentNode.replaceChild(newTab, tab);\n            newTab.addEventListener('click', origTabHandler);\n        });\n    </script>\n</body>\n</html>\n"
